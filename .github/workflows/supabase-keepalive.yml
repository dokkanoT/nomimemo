name: Supabase keepalive

# Supabase 無料プランは 7 日間アクセスがないとプロジェクトが一時停止する。
# 週 2 回 keepalive 表の 1 行を更新して、止まらないようにする。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   SUPABASE_URL        … https://<project-ref>.supabase.co
#   SUPABASE_SECRET_KEY … Project Settings → API Keys の secret key（sb_secret_...）

on:
  schedule:
    # 月曜・木曜の 9:00（日本時間）。cron は UTC で書く
    - cron: "0 0 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Update keepalive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_URL または SUPABASE_SECRET_KEY が設定されていません"
            exit 1
          fi

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          body="$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X PATCH "$SUPABASE_URL/rest/v1/keepalive?id=eq.1" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"pinged_at\":\"$now\"}")"

          echo "$body"

          # 1 行も更新されなかった（表や行がない）場合は失敗にする
          if [ "$body" = "[]" ]; then
            echo "::error::keepalive の行が見つかりません。マイグレーションが適用されているか確認してください"
            exit 1
          fi
